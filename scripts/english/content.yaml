    title: 系统设计面试：限流器
    prompt: "Interview. The AI is a system design interviewer. Say: 'How would you design a rate limiter for our public developer platform?' Let the candidate ask questions and think out loud. Challenge them on distributed counting, accuracy versus cost, and what happens when the limiter itself fails."
