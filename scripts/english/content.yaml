  - id: s35
    phase: 3
    kind: roleplay
    title: 谈薪资
    prompt: "Roleplay. The AI plays Grace, an in-house recruiter. She has just made a verbal offer for a senior backend role in Singapore, with a base salary slightly below what the candidate hoped for. Negotiate politely: express enthusiasm, give a number with a reason, and explore base, signing bonus, and equity. Grace should say the base is fairly fixed at first, but have some flexibility elsewhere."
