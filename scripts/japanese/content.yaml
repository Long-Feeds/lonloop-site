# /japanese/ content source. Every audible item on the site is listed here once.
#
# Words carry `w` (written form the TTS is fed, usually with kanji so the engine
# picks the right homophone) and `r` (the hiragana reading we teach). The accent
# is NOT written by hand: build.py looks the (w, r) pair up in two independent
# dictionaries (UniDic and Kanjium) and only keeps a word when they agree, then
# verify.py checks that the synthesized audio actually carries that accent.
#
# Where a slot lists several candidates, the first one that passes every check
# is published; the rest are fallbacks so a single TTS misreading does not leave
# a hole in a lesson. Rejected candidates are listed in reports/ with the reason.

