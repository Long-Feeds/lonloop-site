# Stage 1 (初级上, about JLPT N5) content source.
#
# Nothing here is trusted as written. n5data.py checks every entry before a page
# may use it, and drops (and reports) what fails:
#   * verbs / adjectives: the group is declared here AND read from UniDic (cType /
#     POS); every conjugated form is generated by code and must parse back
#     (fugashi + UniDic) to the same lemma, the expected conjugation form and the
#     expected reading.
#   * sentences: the kana reading written here must equal UniDic's reading of the
#     sentence (with a short, published list of tolerated variants such as 私 =
#     わたし/わたくし); the pronunciation used for the audio check (は→わ, へ→え,
#     を→お) is taken from UniDic, not typed by hand; every content word must be on
#     the N5 vocabulary list (or taught in stage 0, or be a name/counter).
#   * kanji: readings come from KANJIDIC2 and the official 常用漢字表 (two sources),
#     example-word readings from UniDic, per-kanji splits from JmdictFurigana,
#     stroke data from KanjiVG (checked against animCJK and KANJIDIC2),
#     简体 forms from OpenCC (checked against Unihan).
# Accent marks are never written here: dictcheck.py (UniDic × Kanjium) decides.

verbs:
  # g: godan | ichidan | irregular (checked against UniDic cType)
  # w: dictionary form as published, r: reading, zh: meaning
  # tag: lookalike = ends in -iru/-eru but is godan (must be memorized)
  godan:
    - {w: 会う, r: あう, zh: 见面（「人に会う」）}
    - {w: 買う, r: かう, zh: 买}
    - {w: 言う, r: いう, zh: 说}
    - {w: 書く, r: かく, zh: 写}
    - {w: 聞く, r: きく, zh: 听；问}
    - {w: 行く, r: いく, zh: 去, tag: iku}
    - {w: 泳ぐ, r: およぐ, zh: 游泳}
    - {w: 話す, r: はなす, zh: 说话；谈}
    - {w: 貸す, r: かす, zh: 借给（别人）}
    - {w: 待つ, r: まつ, zh: 等}
    - {w: 持つ, r: もつ, zh: 拿；带着}
    - {w: 死ぬ, r: しぬ, zh: 死}
    - {w: 遊ぶ, r: あそぶ, zh: 玩}
    - {w: 呼ぶ, r: よぶ, zh: 叫；喊；邀请}
    - {w: 読む, r: よむ, zh: 读；看（书报）}
    - {w: 飲む, r: のむ, zh: 喝；吃（药）}
    - {w: 休む, r: やすむ, zh: 休息；请假}
    - {w: 分かる, r: わかる, zh: 懂；明白（「〜が分かる」）}
    - {w: 乗る, r: のる, zh: 乘坐（「〜に乗る」）}
    - {w: ある, r: ある, zh: （物）在；有, tag: aru}
    - {w: 帰る, r: かえる, zh: 回去；回来, tag: lookalike}
    - {w: 入る, r: はいる, zh: 进入（「〜に入る」）, tag: lookalike}
    - {w: 走る, r: はしる, zh: 跑, tag: lookalike}
    - {w: 知る, r: しる, zh: 知道；得知, tag: lookalike}
    - {w: 切る, r: きる, zh: 切；剪, tag: lookalike}
    - {w: 要る, r: いる, zh: 需要, tag: lookalike}
  ichidan:
    - {w: 食べる, r: たべる, zh: 吃}
    - {w: 見る, r: みる, zh: 看}
    - {w: 起きる, r: おきる, zh: 起床}
    - {w: 寝る, r: ねる, zh: 睡觉}
    - {w: 着る, r: きる, zh: 穿（上衣、连衣裙等）}
    - {w: いる, r: いる, zh: （人、动物）在；有}
    - {w: 出る, r: でる, zh: 出去；离开}
    - {w: 教える, r: おしえる, zh: 教；告诉}
    - {w: 借りる, r: かりる, zh: 借（进来）}
    - {w: 降りる, r: おりる, zh: 下（车）}
  irregular:
    - {w: する, r: する, zh: 做}
    - {w: 来る, r: くる, zh: 来}
    - {w: 勉強する, r: べんきょうする, zh: 学习}

adjectives:
  i:
    - {w: 大きい, r: おおきい, zh: 大}
    - {w: 小さい, r: ちいさい, zh: 小}
    - {w: 高い, r: たかい, zh: 高；贵}
    - {w: 安い, r: やすい, zh: 便宜}
    - {w: 新しい, r: あたらしい, zh: 新}
    - {w: 古い, r: ふるい, zh: 旧（东西）}
    - {w: 暑い, r: あつい, zh: （天气）热}
    - {w: 寒い, r: さむい, zh: （天气）冷}
    - {w: おいしい, r: おいしい, zh: 好吃}
    - {w: 楽しい, r: たのしい, zh: 开心；愉快}
    - {w: 忙しい, r: いそがしい, zh: 忙}
    - {w: 難しい, r: むずかしい, zh: 难}
    - {w: 長い, r: ながい, zh: 长}
    - {w: 短い, r: みじかい, zh: 短}
    - {w: 近い, r: ちかい, zh: 近}
    - {w: 遠い, r: とおい, zh: 远}
    - {w: 白い, r: しろい, zh: 白}
    - {w: 黒い, r: くろい, zh: 黑}
    - {w: 広い, r: ひろい, zh: 宽敞；宽}
    - {w: おもしろい, r: おもしろい, zh: 有意思；有趣}
    - {w: いい, r: いい, zh: 好, tag: ii}
  na:
    - {w: きれい, r: きれい, zh: 漂亮；干净, tag: looks_i}
    - {w: 有名, r: ゆうめい, zh: 有名, tag: looks_i}
    - {w: 嫌い, r: きらい, zh: 讨厌；不喜欢, tag: looks_i}
    - {w: 静か, r: しずか, zh: 安静}
    - {w: 元気, r: げんき, zh: 健康；有精神}
    - {w: 好き, r: すき, zh: 喜欢（「〜が好き」）}
    - {w: 大好き, r: だいすき, zh: 非常喜欢}
    - {w: 上手, r: じょうず, zh: （技能）好；擅长}
    - {w: 下手, r: へた, zh: （技能）差；不擅长}
    - {w: 便利, r: べんり, zh: 方便}
    - {w: 暇, r: ひま, zh: 有空；空闲}
    - {w: 大切, r: たいせつ, zh: 重要；珍贵}
    - {w: 大丈夫, r: だいじょうぶ, zh: 没关系；不要紧}
    - {w: にぎやか, r: にぎやか, zh: 热闹}
    - {w: 丈夫, r: じょうぶ, zh: 结实；耐用}
    - {w: 立派, r: りっぱ, zh: 出色；气派}
    - {w: いろいろ, r: いろいろ, zh: 各种各样}
    - {w: 嫌, r: いや, zh: 不愿意；讨厌}
  # noun phrases showing 连体 (adjective + noun), each word must also be N5
  phrases:
    - {w: 大きい犬, r: おおきいいぬ, zh: 大狗}
    - {w: 新しい本, r: あたらしいほん, zh: 新书}
    - {w: いい天気, r: いいてんき, zh: 好天气}
    - {w: 静かな部屋, r: しずかなへや, zh: 安静的房间}
    - {w: きれいな花, r: きれいなはな, zh: 漂亮的花}
    - {w: 有名な人, r: ゆうめいなひと, zh: 有名的人}

# Example sentences. r = the kana reading as written (particles stay は・へ・を);
# spaces only mark word groups for display. id prefixes: p- particles lesson,
# v- verbs lesson, a- adjectives lesson. `focus` = the particle(s) the sentence
# illustrates; n5data.py checks UniDic really tags them as particles.
sentences:
  # --- は
  - {id: p-wa-1, w: 私は学生です。, r: わたしは がくせいです, zh: 我是学生。, focus: [は]}
  - {id: p-wa-2, w: 今日は暑いです。, r: きょうは あついです, zh: 今天很热。, focus: [は]}
  - {id: p-wa-3, w: 肉は食べますが、魚は食べません。, r: にくは たべますが、さかなは たべません, zh: 肉我吃，鱼不吃。, focus: [は]}
  # --- が
  - {id: p-ga-1, w: 誰が来ましたか。, r: だれが きましたか, zh: 谁来了？, focus: [が]}
  - {id: p-ga-2, w: 田中さんが来ました。, r: たなかさんが きました, zh: 是田中来了。, focus: [が]}
  - {id: p-ga-3, w: 机の上に本があります。, r: つくえの うえに ほんが あります, zh: 桌子上有书。, focus: [が, に]}
  - {id: p-ga-4, w: 私は猫が好きです。, r: わたしは ねこが すきです, zh: 我喜欢猫。, focus: [が]}
  - {id: p-ga-5, w: 日本語が少し分かります。, r: にほんごが すこし わかります, zh: 我懂一点日语。, focus: [が]}
  - {id: p-wa-4, w: 田中さんは来ませんでした。, r: たなかさんは きませんでした, zh: 田中（倒是）没来。, focus: [は]}
  # --- を
  - {id: p-o-1, w: 毎朝パンを食べます。, r: まいあさ パンを たべます, zh: 每天早上吃面包。, focus: [を]}
  - {id: p-o-2, w: 毎朝、公園を散歩します。, r: まいあさ、こうえんを さんぽします, zh: 每天早上在公园里散步。, focus: [を]}
  - {id: p-o-3, w: 橋を渡ります。, r: はしを わたります, zh: 过桥。, focus: [を]}
  - {id: p-o-4, w: 八時に家を出ます。, r: はちじに いえを でます, zh: 八点出门。, focus: [を, に]}
  - {id: p-o-5, w: 駅でバスを降ります。, r: えきで バスを おります, zh: 在车站下公共汽车。, focus: [を, で]}
  # --- に
  - {id: p-ni-1, w: 毎日六時に起きます。, r: まいにち ろくじに おきます, zh: 每天六点起床。, focus: [に]}
  - {id: p-ni-2, w: 来週、日本に行きます。, r: らいしゅう、にほんに いきます, zh: 下周去日本。, focus: [に]}
  - {id: p-ni-3, w: 猫は庭にいます。, r: ねこは にわに います, zh: 猫在院子里。, focus: [に]}
  - {id: p-ni-4, w: 友達に手紙を書きます。, r: ともだちに てがみを かきます, zh: 给朋友写信。, focus: [に]}
  - {id: p-ni-5, w: 駅で友達に会います。, r: えきで ともだちに あいます, zh: 在车站和朋友见面。, focus: [に, で]}
  - {id: p-ni-6, w: 電車に乗ります。, r: でんしゃに のります, zh: 坐电车。, focus: [に]}
  - {id: p-ni-7, w: 部屋に入ります。, r: へやに はいります, zh: 进房间。, focus: [に]}
  - {id: p-ni-8, w: 私は図書館にいます。, r: わたしは としょかんに います, zh: 我在图书馆。, focus: [に]}
  # --- で
  - {id: p-de-1, w: 図書館で勉強します。, r: としょかんで べんきょうします, zh: 在图书馆学习。, focus: [で]}
  - {id: p-de-2, w: バスで学校へ行きます。, r: バスで がっこうへ いきます, zh: 坐公共汽车去学校。, focus: [で, へ]}
  - {id: p-de-3, w: 日本語で話してください。, r: にほんごで はなしてください, zh: 请用日语说。, focus: [で]}
  # --- へ
  - {id: p-e-1, w: 来年、国へ帰ります。, r: らいねん、くにへ かえります, zh: 明年回国。, focus: [へ]}
  - {id: p-e-2, w: どこへ行きますか。, r: どこへ いきますか, zh: 你去哪儿？, focus: [へ]}
  - {id: p-e-3, w: 明日、学校へ行きます。, r: あした、がっこうへ いきます, zh: 明天去学校。, focus: [へ]}
  # --- と / や
  - {id: p-to-1, w: 友達と映画を見ます。, r: ともだちと えいがを みます, zh: 和朋友一起看电影。, focus: [と]}
  - {id: p-to-2, w: パンと卵を買いました。, r: パンと たまごを かいました, zh: 买了面包和鸡蛋（就这两样）。, focus: [と]}
  - {id: p-ya-1, w: パンや卵を買いました。, r: パンや たまごを かいました, zh: 买了面包、鸡蛋等。, focus: [や]}
  - {id: p-ya-2, w: 机の上に本やノートがあります。, r: つくえの うえに ほんや ノートが あります, zh: 桌子上有书啊、笔记本啊（等等）。, focus: [や]}
  # --- も
  - {id: p-mo-1, w: 私も学生です。, r: わたしも がくせいです, zh: 我也是学生。, focus: [も]}
  - {id: p-mo-2, w: 肉も魚も食べます。, r: にくも さかなも たべます, zh: 肉和鱼都吃。, focus: [も]}
  - {id: p-mo-3, w: 友達も行きます。, r: ともだちも いきます, zh: 朋友也去。, focus: [も]}
  - {id: p-to-3, w: 友達と行きます。, r: ともだちと いきます, zh: 和朋友一起去。, focus: [と]}
  # --- の
  - {id: p-no-1, w: これは日本語の本です。, r: これは にほんごの ほんです, zh: 这是日语书。, focus: [の]}
  - {id: p-no-2, w: 友達の家は駅の近くです。, r: ともだちの いえは えきの ちかくです, zh: 朋友家在车站附近。, focus: [の]}
  # --- から / まで
  - {id: p-kara-1, w: 八時から五時まで働きます。, r: はちじから ごじまで はたらきます, zh: 从八点工作到五点。, focus: [から, まで]}
  - {id: p-kara-2, w: 駅から家まで歩きます。, r: えきから いえまで あるきます, zh: 从车站走回家。, focus: [から, まで]}
  - {id: p-kara-3, w: 雨ですから、出かけません。, r: あめですから、でかけません, zh: 因为下雨，所以不出门。, focus: [から]}
  - {id: p-made-1, w: 駅まで歩きます。, r: えきまで あるきます, zh: 走到车站。, focus: [まで]}
  - {id: p-kara-4, w: 駅から歩きます。, r: えきから あるきます, zh: 从车站走过去。, focus: [から]}
  # --- か
  - {id: p-ka-1, w: 日本語は難しいですか。, r: にほんごは むずかしいですか, zh: 日语难吗？, focus: [か]}
  - {id: p-ka-2, w: コーヒーか紅茶を飲みます。, r: コーヒーか こうちゃを のみます, zh: 喝咖啡或者红茶。, focus: [か]}
  # --- ね / よ
  - {id: p-ne-1, w: 今日は寒いですね。, r: きょうは さむいですね, zh: 今天真冷啊。, focus: [ね]}
  - {id: p-yo-1, w: この店のパンはおいしいですよ。, r: この みせの パンは おいしいですよ, zh: 这家店的面包很好吃哦。, focus: [よ]}
  - {id: p-ne-2, w: おいしいですね。, r: おいしいですね, zh: 真好吃啊（附和对方）。, focus: [ね]}
  - {id: p-yo-2, w: おいしいですよ。, r: おいしいですよ, zh: 很好吃哦（告诉对方）。, focus: [よ]}
  # --- verbs lesson
  - {id: v-s-1, w: 毎日日本語を勉強します。, r: まいにち にほんごを べんきょうします, zh: 每天学习日语。, focus: [を]}
  - {id: v-s-2, w: 昨日は雨が降りました。, r: きのうは あめが ふりました, zh: 昨天下雨了。, focus: [は, が]}
  - {id: v-s-3, w: 日曜日は働きません。, r: にちようびは はたらきません, zh: 星期天不工作。, focus: [は]}
  - {id: v-s-4, w: 名前を書いてください。, r: なまえを かいてください, zh: 请写上名字。, focus: [を]}
  - {id: v-s-5, w: 田中さんを知っていますか。, r: たなかさんを しっていますか, zh: 你认识田中吗？, focus: [を]}
  # --- adjectives lesson
  - {id: a-s-1, w: この本は高いです。, r: この ほんは たかいです, zh: 这本书很贵。, focus: [は]}
  - {id: a-s-2, w: 昨日は寒かったです。, r: きのうは さむかったです, zh: 昨天很冷。, focus: [は]}
  - {id: a-s-3, w: この部屋は静かじゃありません。, r: この へやは しずかじゃありません, zh: 这个房间不安静。, focus: [は]}
  - {id: a-s-4, w: 田中さんは歌が上手です。, r: たなかさんは うたが じょうずです, zh: 田中唱歌唱得好。, focus: [は, が]}
  - {id: a-s-5, w: この部屋は広くて明るいです。, r: この へやは ひろくて あかるいです, zh: 这个房间又宽敞又明亮。, focus: [は]}

# Listening drills: each set must differ only in what the drill is about.
drills:
  particles:
    - [p-to-3, p-mo-3]
    - [p-to-2, p-ya-1]
    - [p-made-1, p-kara-4]
    - [p-ne-2, p-yo-2]
    - [p-ga-2, p-wa-4]

kanji:
  # 103 kanji = the pre-2010 official JLPT 4級 kanji list (as recorded in
  # KANJIDIC2) — the 79 that Jonathan Waller's N5 list also contains are marked
  # "core" by n5data.py. g: theme group (page section). ex: example words
  # (N5 vocabulary where possible); note: Chinese-speaker note (optional).
  groups:
    - {id: num, title: 数字与金额}
    - {id: time, title: 时间与日期}
    - {id: people, title: 人与身体}
    - {id: place, title: 方位与场所}
    - {id: nature, title: 自然与天气}
    - {id: action, title: 动作（常用动词）}
    - {id: quality, title: 性质（常用形容词）}
    - {id: misc, title: 其他常用字}
  list:
    # ---- 数字与金额
    - {k: 一, g: num, zh: 一, ex: [{w: 一つ, r: ひとつ, zh: 一个}, {w: 一人, r: ひとり, zh: 一个人}]}
    - {k: 二, g: num, zh: 二, ex: [{w: 二つ, r: ふたつ, zh: 两个}, {w: 二人, r: ふたり, zh: 两个人}]}
    - {k: 三, g: num, zh: 三, ex: [{w: 三つ, r: みっつ, zh: 三个}, {w: 三日, r: みっか, zh: 三号；三天}]}
    - {k: 四, g: num, zh: 四, ex: [{w: 四つ, r: よっつ, zh: 四个}, {w: 四日, r: よっか, zh: 四号；四天}]}
    - {k: 五, g: num, zh: 五, ex: [{w: 五つ, r: いつつ, zh: 五个}, {w: 五日, r: いつか, zh: 五号；五天}]}
    - {k: 六, g: num, zh: 六, ex: [{w: 六つ, r: むっつ, zh: 六个}, {w: 六日, r: むいか, zh: 六号；六天}]}
