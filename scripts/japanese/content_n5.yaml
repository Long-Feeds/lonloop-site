  # Notes for Chinese speakers. Only meaning differences that a reputable
  # dictionary states; form differences are generated from OpenCC/Unihan.
  notes:
    本: "日语「本（ほん）」是「书」。"
    行: "「行く」是「去」。中文「行」表示「可以」的意思，日语不这样用。"
    聞: "「聞く」日常主要是「听」和「问」（如「道を聞く」问路）。"
    新: "「新聞（しんぶん）」是报纸，不是中文的「新闻」（新闻是「ニュース」）。"
    安: "「安い」是便宜。"
    手: "「手紙」是信，「切手」是邮票，「上手／下手」是擅长／不擅长——都和中文字面意思不同。"
    先: "「先生」是老师（也用来称呼医生、律师等），不是中文「先生」的意思；「先週」「先月」的「先」是「上一个」。"
    来: "「来週」「来月」「来年」的「来」是「下一个」：下周、下个月、明年。"
    大: "「大人（おとな）」是成年人。"
    車: "「車（くるま）」一般指汽车。"
    会: "「会社」是公司。"
    古: "「古い」是旧（东西旧），不用来说人年纪大。"
    高: "「高い」既是「高」，也是「贵」。"
    円: "日本的货币「円」（えん）就是日元；「円」和简体「圆」同源。"
    曜日: "日语的星期用「日月火水木金土」＋「曜日」：月曜日是星期一……日曜日是星期日。"
